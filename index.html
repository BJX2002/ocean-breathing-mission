<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Ocean Breathing Mission | 海洋呼吸任務</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #04121f;
        overflow: hidden;
        /* Prevent iOS/tablet gestures from hijacking touch controls. */
        touch-action: none;
        -webkit-tap-highlight-color: transparent;
      }

      #game {
        box-sizing: border-box;
        width: 100dvw;
        height: 100dvh;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom)
          env(safe-area-inset-left);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game canvas {
        max-width: 100%;
        max-height: 100%;
        touch-action: none;
      }

      #orientation-message {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 9999;
        align-items: center;
        justify-content: center;
        padding: 40px;
        color: #e7fbff;
        background: #04121f;
        font:
          600 24px/1.55 Arial,
          sans-serif;
        text-align: center;
      }

      @media (orientation: portrait) and (pointer: coarse) {
        #orientation-message {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="orientation-message">
      請將 iPad 轉為橫向以開始調查<br />Rotate your iPad to landscape to play
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
